# App-private command aliases for the native libraries packaged by ABI.
# Each key is a library filename in ApplicationInfo.nativeLibraryDir.
# Values are comma-separated paths relative to $PREFIX.
libusb.so=lib/libusb.so,lib/libusb-1.0.so
libusb_bridge.so=lib/libusb_bridge.so
libfwmark.so=lib/libfwmark.so
libpty.so=lib/libpty.so
libdatastore_shared_counter.so=lib/libdatastore_shared_counter.so
libtest.so=bin/tst
libadb.so=bin/adb
libfastboot.so=bin/fastboot
libunitool_usb_probe.so=bin/unitool-usb-probe
libunitool_libusb_probe.so=bin/unitool-libusb-probe
libunitool_libusb_wrap_probe.so=bin/unitool-libusb-wrap-probe
libunitool_mtk_usb_probe.so=bin/unitool-mtk-usb-probe
libmake_f2fs.so=bin/make_f2fs
libmke2fs.so=bin/mke2fs
libqdl.so=bin/qdl
libheimdall.so=lib/libheimdall_legacy.so
libheimdall_rpc.so=bin/heimdall
libbash.so=bin/bash,bin/sh
libclear.so=bin/clear
libcoreutils.so=bin/coreutils,bin/cut,bin/cp,bin/mv,bin/mkdir,bin/rm,bin/rmdir,bin/echo,bin/env,bin/ln,bin/pwd,bin/tty,bin/sleep,bin/timeout,bin/split,bin/test,bin/readlink,bin/realpath,bin/printf,bin/mktemp,bin/dirname,bin/dircolors,bin/dir,bin/basename,bin/ls
libumbrage_cli_exec.so=bin/mtk,bin/umbrage
# Archive utility (7-Zip command line).
lib7zz.so=bin/7zz
# KernelSU userspace control/daemon utility; availability depends on device build.
libksud.so=bin/ksud
# Android dynamic-partition super image builder.
liblpmake.so=bin/lpmake
# Shared operations-crypto support library; not exposed as a shell command.
libopscrypto.so=lib/libopscrypto.so
# Serial-number image patch utility (SN.IMG format).
libpatch_sn.so=bin/patch_sn
# Android payload.bin partition dumper.
libpayload-dumper-go.so=bin/payload-dumper-go
# Android sparse-image to raw-image converter.
libsimg2img.so=bin/simg2img
